{% extends "base.html" %}

{% block title %}500 Server Error - WorkPulse{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4">An unexpected error occurred on the server. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2 fw-semibold">
        <i class="fa-solid fa-house me-2"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
