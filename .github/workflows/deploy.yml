name: CI/CD Pipeline - Cloud-Based AQI Predictor

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cloud-aqi-predictor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ./cloud-aqi-predictor/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify Dataset and Model Artifacts
        run: |
          python src/train.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v

  docker-build:
    name: Build & Validate Docker Container
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./cloud-aqi-predictor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./cloud-aqi-predictor
          file: ./cloud-aqi-predictor/Dockerfile
          push: false
          tags: cloud-aqi-predictor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Container Startup & Health Check
        run: |
          docker build -t cloud-aqi-predictor:latest .
          docker run -d --name aqi-app -p 8000:8000 cloud-aqi-predictor:latest
          sleep 5
          curl -f http://localhost:8000/health || (docker logs aqi-app && exit 1)
          docker stop aqi-app && docker rm aqi-app
