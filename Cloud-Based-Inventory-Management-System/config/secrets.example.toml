# Configuration Directory Secrets Template
# Path: config/secrets.example.toml
# Use this when running batch jobs, migration scripts, or microservices independently of Streamlit.

[database]
host = "your-dbaas-host.region.provider.com"
port = 3306
database = "inventory_db"
user = "admin_user"
password = "your-secure-dbaas-password"
ssl_enabled = true
pool_size = 5
max_overflow = 10
pool_recycle = 1800

[cloud]
provider = "aws"  # Options: aws, gcp, azure, aiven, planetscale
region = "us-east-1"
